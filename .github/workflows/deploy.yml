name: Deploy Daily Briefing Website

on:
  push:
    branches: [main]
  schedule:
    # Run daily at 08:00 UTC+8 (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei

      - name: Verify fonts installed
        run: |
          fc-list :lang=zh | head -5 || echo "No zh fonts found"
          ls -la /usr/share/fonts/opentype/noto/ 2>/dev/null || true
          ls -la /usr/share/fonts/truetype/wqy/ 2>/dev/null || true

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run daily briefing pipeline
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          PYTHONPATH=src python3 src/main.py || true

      - name: Generate website
        # The generator also copies poster images into website/assets/<date>/
        run: |
          PYTHONPATH=src python3 src/generator/website.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
