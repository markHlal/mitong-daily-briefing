<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="./icon.jpg" type="image/jpeg">
<title>全球态势 · 米桶 AI 早报</title>
<style>
:root {
    --paper: #F6F1E7;
    --paper-deep: #EDE5D4;
    --ink: #1B1611;
    --ink-soft: #57503F;
    --ink-faint: #93876F;
    --verm: #C2341B;
    --verm-deep: #9E2A15;
    --rule: rgba(27, 22, 17, 0.18);
    --rule-soft: rgba(27, 22, 17, 0.09);
    --serif: "Songti SC", "STSong", "Noto Serif SC", "SimSun", Georgia, serif;
    --ease-out: cubic-bezier(0.19, 1, 0.22, 1);
    --masthead-h: 54px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    overflow: hidden;
}
::selection { background: var(--verm); color: var(--paper); }

/* ── Masthead ── */
.masthead {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    height: var(--masthead-h);
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
}
.masthead-inner {
    max-width: 1280px;
    margin: 0 auto;
    height: 100%;
    padding: 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}
.brand { text-decoration: none; color: var(--ink); display: flex; align-items: center; }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-name { font-size: 19px; font-weight: 700; letter-spacing: 0.06em; }
.brand-sub {
    display: flex; align-items: center; gap: 5px;
    font-size: 10.5px; letter-spacing: 0.3em; color: var(--ink-faint);
}
.brand-sub img { width: 13px; height: 13px; object-fit: contain; border-radius: 3px; }

.tabs { display: flex; align-items: center; gap: 10px; }
.tab {
    font-size: 12px;
    letter-spacing: 0.22em;
    text-decoration: none;
    padding: 4px 14px 5px;
    border-radius: 999px;
    border: 1px solid transparent;
    color: var(--ink-soft);
    transition: border-color 0.25s, color 0.25s, background 0.25s;
}
.tab:hover { border-color: var(--verm); color: var(--verm); }
.tab.active {
    background: var(--verm);
    color: var(--paper);
    border-color: var(--verm);
}
.tab.full-version {
    color: var(--ink-faint);
    letter-spacing: 0.1em;
}
.tab.full-version:hover { color: var(--verm); }

/* ── Map stage ── */
.stage {
    position: fixed;
    top: var(--masthead-h); left: 0; right: 0; bottom: 0;
    background: #0E1216;
}
.stage iframe {
    width: 100%; height: 100%;
    border: 0; display: block;
    opacity: 0;
    transition: opacity 0.9s var(--ease-out);
}
.stage iframe.loaded { opacity: 1; }

/* Loading veil */
.veil {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    color: #B9AE97;
    pointer-events: none;
    transition: opacity 0.6s;
}
.veil.gone { opacity: 0; }
.veil .seal {
    width: 54px; height: 54px;
    background: var(--verm);
    color: var(--paper);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700; letter-spacing: 0.08em;
    writing-mode: vertical-rl;
    border-radius: 4px;
    animation: sealpulse 1.6s ease-in-out infinite;
}
@keyframes sealpulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(0.94); }
}
.veil .veil-text { font-size: 12px; letter-spacing: 0.5em; text-indent: 0.5em; }

/* Live strip */
.livestrip {
    position: absolute;
    left: 18px; bottom: 14px;
    z-index: 10;
    display: flex; align-items: center; gap: 8px;
    background: rgba(14, 18, 22, 0.72);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(246, 241, 231, 0.14);
    border-radius: 999px;
    padding: 6px 14px;
    color: #D8CFBB;
    font-size: 11px;
    letter-spacing: 0.28em;
    pointer-events: none;
}
.live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #E4572E;
    animation: blink 1.4s ease-in-out infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

/* Attribution */
.attrib {
    position: absolute;
    right: 18px; bottom: 14px;
    z-index: 10;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: rgba(216, 207, 187, 0.75);
    background: rgba(14, 18, 22, 0.72);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(246, 241, 231, 0.1);
    border-radius: 999px;
    padding: 6px 13px;
}
.attrib a { color: #D8CFBB; text-decoration: none; border-bottom: 1px solid rgba(216,207,187,0.35); }
.attrib a:hover { color: #fff; }

@media (max-width: 640px) {
    .masthead-inner { padding: 0 16px; }
    .tab { letter-spacing: 0.1em; padding: 4px 10px 5px; }
    .tab.full-version { display: none; }
    .attrib { display: none; }
    .brand-name { font-size: 16px; }
}
</style>
</head>
<body>

<header class="masthead">
    <div class="masthead-inner">
        <a href="./" class="brand">
            <span class="brand-text">
                <span class="brand-name">AI 早报</span>
                <span class="brand-sub"><img src="./icon.jpg" alt="米桶">米桶</span>
            </span>
        </a>
        <nav class="tabs">
            <span class="tab active">全球态势</span>
            <a class="tab" href="./cn/">国内早报</a>
            <a class="tab full-version" href="https://www.worldmonitor.app/?lang=zh" target="_blank" rel="noopener">完整版 ↗</a>
        </nav>
    </div>
</header>

<main class="stage">
    <div class="veil" id="veil">
        <div class="seal">米桶</div>
        <div class="veil-text">正在接通全球实时态势</div>
    </div>
    <iframe id="worldmap"
        src="https://www.worldmonitor.app/embed?layers=conflicts,earthquakes,protests,weather&center=25,15&zoom=1&theme=dark&variant=full"
        title="World Monitor 全球实时态势地图"
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen></iframe>
    <div class="livestrip"><span class="live-dot"></span>全球实时态势 · LIVE</div>
    <div class="attrib">实时地图 · <a href="https://www.worldmonitor.app/?lang=zh" target="_blank" rel="noopener">World Monitor</a>（AGPL-3.0）</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
(function () {
    var frame = document.getElementById('worldmap');
    var veil = document.getElementById('veil');
    function reveal() {
        frame.classList.add('loaded');
        veil.classList.add('gone');
    }
    frame.addEventListener('load', function () { setTimeout(reveal, 350); });
    setTimeout(reveal, 9000); // safety: never leave the veil up forever

    if (window.gsap) {
        gsap.from('.masthead-inner', { y: -26, opacity: 0, duration: 0.6, ease: 'power3.out' });
        gsap.from('.livestrip', { y: 16, opacity: 0, duration: 0.7, delay: 0.5, ease: 'power3.out' });
        gsap.from('.attrib', { y: 16, opacity: 0, duration: 0.7, delay: 0.65, ease: 'power3.out' });
    }
})();
</script>
</body>
</html>
