<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026-07-31 · 米桶 AI 早报</title>
    <style>
:root {
    --bg: #F5F7FA;
    --surface: #FFFFFF;
    --text: #1D1D1F;
    --text-secondary: #6E6E73;
    --text-tertiary: #86868B;
    --blue: #0071E3;
    --blue-light: #E8F4FD;
    --border: rgba(0,0,0,0.06);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
    --shadow: 0 4px 24px rgba(0,0,0,0.06);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.1);
    --radius-sm: 16px;
    --radius: 24px;
    --radius-lg: 32px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

/* Header */
.header {
    position: fixed; top: 0; left: 0; right: 0;
    background: rgba(255,255,255,0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
    transition: background 0.3s;
}
.header-brand {
    font-size: 20px;
    font-weight: 600;
    color: var(--blue);
    text-decoration: none;
    letter-spacing: -0.3px;
}
.header-sub { font-size: 12px; color: var(--text-tertiary); margin-left: 4px; font-weight: 400; }
.header-back {
    color: var(--blue);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 100px;
    transition: background 0.2s;
}
.header-back:hover { background: var(--blue-light); }

/* Hero */
.hero {
    max-width: 860px;
    margin: 0 auto;
    padding: 140px 24px 60px;
    text-align: center;
}
.hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px 20px;
    border-radius: 100px;
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 32px;
    box-shadow: var(--shadow-sm);
}
.hero-badge .dot {
    width: 8px; height: 8px;
    background: #34C759;
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}
.hero h1 {
    font-size: 56px;
    font-weight: 700;
    letter-spacing: -1.5px;
    line-height: 1.1;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #1D1D1F 0%, #434344 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.hero-sub {
    font-size: 21px;
    color: var(--text-secondary);
    font-weight: 400;
    margin-bottom: 8px;
}
.hero-date {
    font-size: 15px;
    color: var(--text-tertiary);
    font-weight: 500;
}

/* Section */
.section {
    max-width: 860px;
    margin: 0 auto 64px;
    padding: 0 24px;
}
.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
}
.section-title {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 12px;
}
.section-title::before {
    content: "";
    width: 4px; height: 24px;
    background: var(--blue);
    border-radius: 2px;
}
.section-count {
    font-size: 13px;
    color: var(--text-tertiary);
    background: var(--surface);
    padding: 4px 12px;
    border-radius: 100px;
    border: 1px solid var(--border);
}

/* Image Card */
.image-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 28px;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
    will-change: transform;
    cursor: pointer;
}
.image-card:hover {
    transform: translateY(-6px) scale(1.005);
    box-shadow: var(--shadow-lg);
}
.image-card img {
    width: 100%;
    display: block;
    opacity: 1;
}
.image-card.animate-in img {
    opacity: 0;
    animation: imgFadeIn 0.8s ease forwards;
}
@keyframes imgFadeIn {
    to { opacity: 1; }
}
    width: 100%;
    display: block;
    opacity: 0;
    transition: opacity 0.6s ease;
}
.image-card .label {
    padding: 18px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.label-text { font-size: 15px; color: var(--text-secondary); font-weight: 500; }
.label-tag {
    font-size: 12px;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: 100px;
    background: var(--blue-light);
    color: var(--blue);
    letter-spacing: 0.3px;
}

/* History */
.history-section { max-width: 1200px; margin: 0 auto 80px; padding: 0 24px; }
.history-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px;
}
.history-card {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
    text-decoration: none;
    color: inherit;
    will-change: transform;
    opacity: 0;
    transform: translateY(30px);
}
.history-card.visible {
    opacity: 1;
    transform: translateY(0);
}
.history-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
}
.history-card .thumb-wrap {
    position: relative;
    overflow: hidden;
    aspect-ratio: 16/10;
}
.history-card .thumb-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.history-card:hover .thumb-wrap img { transform: scale(1.05); }
.history-card .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 50%);
    opacity: 0;
    transition: opacity 0.3s;
}
.history-card:hover .overlay { opacity: 1; }
.history-card .info {
    padding: 20px 22px;
}
.history-card .date {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: -0.3px;
}
.history-card .meta {
    font-size: 13px;
    color: var(--text-tertiary);
    display: flex;
    align-items: center;
    gap: 6px;
}

/* Empty */
.empty {
    text-align: center;
    padding: 100px 20px;
    color: var(--text-tertiary);
}
.empty-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.6; }
.empty p { font-size: 16px; }

/* Lightbox */
.lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.94);
    z-index: 200;
    justify-content: center;
    align-items: center;
    padding: 20px;
    opacity: 0;
    transition: opacity 0.3s ease;
}
.lightbox.show { display: flex; }
.lightbox.active { opacity: 1; }
.lightbox img {
    max-width: 100%;
    max-height: 90vh;
    border-radius: 16px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    transform: scale(0.9);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.lightbox.active img { transform: scale(1); }
.lightbox .close {
    position: absolute;
    top: 20px;
    right: 28px;
    font-size: 36px;
    color: rgba(255,255,255,0.8);
    cursor: pointer;
    width: 44px; height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    transition: background 0.2s, color 0.2s;
    z-index: 10;
}
.lightbox .close:hover { background: rgba(255,255,255,0.2); color: white; }

/* Footer */
.footer {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-tertiary);
    font-size: 13px;
    border-top: 1px solid var(--border);
    margin-top: 40px;
    line-height: 1.8;
}

/* Responsive */
@media (max-width: 768px) {
    .header { padding: 12px 20px; }
    .hero { padding: 110px 20px 40px; }
    .hero h1 { font-size: 38px; }
    .hero-sub { font-size: 18px; }
    .section { padding: 0 20px; margin-bottom: 48px; }
    .history-section { padding: 0 20px; }
    .history-grid { grid-template-columns: 1fr; gap: 16px; }
    .image-card { border-radius: var(--radius); }
    .image-card .label { padding: 14px 20px; }
}
</style>
</head>
<body>
    <header class="header">
        <a href="./" class="header-brand">米桶 AI <span class="header-sub">Daily Brief</span></a>
        <a href="./" class="header-back">← 返回首页</a>
    </header>

    <section class="hero">
        <div class="hero-badge"><span class="dot"></span>每日更新</div>
        <h1>AI 早报</h1>
        <p class="hero-sub">每日精选 · 10 秒速览</p>
        <p class="hero-date">📅 2026-07-31</p>
    </section>

    <section class="section">
        <div class="section-header">
            <h2 class="section-title">2026-07-31 早报</h2>
        </div>
        
        <div class="image-card" onclick="openLightbox('./output/2026-07-31/detail.png')">
            <img src="./output/2026-07-31/detail.png" alt="详细版">
            <div class="label">
                <span class="label-text">详细版 · 8 条精选资讯</span>
                <span class="label-tag">📱 手机全屏</span>
            </div>
        </div>
        <div class="image-card" onclick="openLightbox('./output/2026-07-31/highlights.png')">
            <img src="./output/2026-07-31/highlights.png" alt="今日看点">
            <div class="label">
                <span class="label-text">今日看点 · 3 条重点</span>
                <span class="label-tag">🎯 精选推荐</span>
            </div>
        </div>
    </section>

    <footer class="footer">
        米桶 AI · 不构成任何建议，仅供信息参考<br>
        自动采集自机器之心、量子位、36氪等信源
    </footer>

    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <span class="close">&times;</span>
        <img src="" alt="大图" id="lightbox-img">
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

// Hero entrance
const heroTl = gsap.timeline({defaults: {ease: "power3.out", duration: 0.8}});
heroTl
    .from(".hero-badge", {y: 20, opacity: 0, duration: 0.6})
    .from(".hero h1", {y: 40, opacity: 0, duration: 1}, "-=0.3")
    .from(".hero-sub", {y: 20, opacity: 0}, "-=0.6")
    .from(".hero-date", {y: 15, opacity: 0}, "-=0.5")
    .from(".section-title", {y: 20, opacity: 0}, "-=0.4");

// Today's cards stagger
gsap.from(".image-card", {
    y: 60,
    opacity: 0,
    duration: 0.9,
    stagger: 0.15,
    ease: "power3.out",
    delay: 0.4
});

// History cards scroll trigger



// Lightbox
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.classList.add("show");
    document.body.style.overflow = "hidden";
    requestAnimationFrame(() => lightbox.classList.add("active"));
}
function closeLightbox(e) {
    if (e.target === e.currentTarget || e.target.classList.contains("close")) {
        lightbox.classList.remove("active");
        setTimeout(() => {
            lightbox.classList.remove("show");
            lightboxImg.src = "";
            document.body.style.overflow = "";
        }, 300);
    }
}
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && lightbox.classList.contains("show")) {
        lightbox.classList.remove("active");
        setTimeout(() => {
            lightbox.classList.remove("show");
            lightboxImg.src = "";
            document.body.style.overflow = "";
        }, 300);
    }
});

// Header blur on scroll
window.addEventListener("scroll", () => {
    const header = document.querySelector(".header");
    if (window.scrollY > 10) {
        header.style.background = "rgba(255,255,255,0.92)";
    } else {
        header.style.background = "rgba(255,255,255,0.72)";
    }
});
</script>
</body>
</html>
